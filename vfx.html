<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粒子序列圖鑑 — 神的瘋狂時節 Wiki</title>
  <link rel="stylesheet" href="css/wiki.css">
</head>
<body data-page="vfx">
  <div class="wiki-shell">
    <header class="topbar" id="topbar"></header>
    <div class="draft-strip" id="draftStrip"></div>

    <div class="workspace">
      <aside class="side-tree mc-panel" id="sideTree"></aside>

      <main class="stage">
        <section class="mc-panel-gold" style="padding:18px;">
          <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
            <div>
              <div class="section-heading" style="margin-bottom:4px;">實機粒子序列幀圖鑑（209 組 · 1,647+ 張貼圖）</div>
              <p style="font-size:0.88rem;color:var(--text-muted);">收錄 <code>textures/particle/*_0..7.png</code> 全部實機粒子序列幀，支援依武器前綴篩選與即時變速播放。</p>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;" id="vfxSpeedBar">
              <button class="filter-btn" data-vfx-speed="220">0.5× 慢速</button>
              <button class="filter-btn active" data-vfx-speed="110">1× 正常</button>
              <button class="filter-btn" data-vfx-speed="55">2× 高速</button>
              <button class="filter-btn" data-vfx-speed="0">⏸ 暫停</button>
            </div>
          </div>
        </section>

        <div class="filter-bar mc-panel" id="vfxFilters"></div>
        <div class="vfx-showcase-grid" id="vfxAllGrid"></div>
      </main>
    </div>

    <footer class="footer mc-panel" id="pageFooter"></footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/vfx-data.js"></script>
  <script src="js/wiki.js"></script>
</body>
</html>
